name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 安装 npm 依赖
        run: npm ci

      - name: 同步前端到 Android 工程
        run: npx cap sync android

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 编译 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 重命名产物
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/workflow-desk-${{ github.ref_name }}.apk"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: workflow-desk-apk
          path: out/*.apk
          retention-days: 30

      - name: 打 tag 时创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
