<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>
/* 浏览器环境立即把安全区归零。
   判断依据：浏览器有端口号（如 :8317），Capacitor 的 origin 是 https://localhost 没有端口。 */
(function () {
  try {
    if (location.port) {
      var r = document.documentElement.style;
      r.setProperty('--sat', '0px');
      r.setProperty('--sab', '0px');
      r.setProperty('--sal', '0px');
      r.setProperty('--sar', '0px');
    }
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>工作流工具台</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="logo">◈</span>
      <div class="brand-text">
        <h1>工作流工具台</h1>
        <span id="saveState" class="save-state">已就绪</span>
      </div>
      <button id="connBadge" class="conn-badge local" title="数据存放位置">⚪ 离线模式</button>
    </div>

    <div class="topbar-actions">
      <input id="search" class="search" type="search" placeholder="搜索工作流 / 环节…" autocomplete="off">
      <button id="btnSettings" class="btn btn-ghost" title="设置">⚙</button>
      <button id="btnBackup" class="btn btn-ghost" title="备份与恢复">备份</button>
      <button id="btnTheme" class="btn btn-ghost" title="切换主题">◐</button>
      <button id="btnNew" class="btn btn-primary">＋ 新建工作流</button>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span>工作流列表</span>
        <span id="wfCount" class="pill">0</span>
      </div>
      <div id="wfList" class="wf-list"></div>
    </aside>

    <main class="content" id="content"></main>

  </div>

  <button id="btnToggleSide" class="btn-side-toggle" title="列表">☰</button>

</div>

<div id="modalRoot"></div>

<script src="/storage.js"></script>
<script src="/app.js"></script>
</body>
</html>
